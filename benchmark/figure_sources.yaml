_about: Where every benchmark image comes from and how scripts/setup_images.py regenerates it. No figure rasters
  are distributed with this repository (see NOTICE.md). `page` is 0-based. `bbox_pts` is [x0, y0, x1, y1] in PDF
  points (1/72 in) on that page; the crop is rendered at a zoom that reproduces exactly `width` x `height` pixels.
  `pdf_sha256` pins the exact document revision the crop coordinates refer to; if the live `url` no longer serves
  that revision, `archive_url` (or the Wayback Machine) is tried next.
