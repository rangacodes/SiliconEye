# ────────────────────────────────────────────────────────────────
# Set 10 — RANC core-controller state machine.
# arxiv_2011.00624 fig_016.jpeg (page 2) — 538x471, copied verbatim from the
# pipeline output. repo: edabk-hust/edabk_brain_soc (59 stars, tier_b,
# trust 5.15 — compliance + silicon).
#
# First set to mix the two categories:
#   category: visual     — q10a..q10e, answerable from the drawing alone
#   category: reasoning  — q10f..q10j, need the drawing PLUS hardware design
#                          knowledge (state encoding, idle states, nested
#                          loops, branch semantics, design rationale)
#
# FSM as drawn: 8 states, 12 transitions. Self-loops on STATE 0 (idle, waits
# for an external tick) and STATE 4 (inner loop over axons). STATE 6 is the
# only branching state: !csram_done returns to STATE 2 (outer loop over CSRAM
# rows), otherwise it proceeds to STATE 7 and back to STATE 0.
# ────────────────────────────────────────────────────────────────
