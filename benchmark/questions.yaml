# ─────────────────────────────────────────────────────────────────────────────
# Set 20 — RISC-V Platform-Level Interrupt Controller, conceptual block diagram.
# Source: riscv-privileged-v1.9.pdf p.73, Figure 7.1
#         (pipeline path url_https___people.eecs.berkeley.edu__krste_papers_
#          riscv-privileged-v1.9.pdf/fig_024.jpeg)
# repo:   anishathalye/notary (28 stars, tier_a, trust 4.2 — formal)
#
# This is the most widely published figure in the benchmark — it appears in the
# RISC-V privileged specification — so leakage was the dominant risk and the blind
# control mattered more here than anywhere else. Three rounds of it:
#   v1  sighted 95.0%  blind 70.0%   7 of 10 leaked at 6/6 blind and were dropped
#   v2  sighted 60.0%  blind 23.3%   7 rebuilt
#   v3  sighted 43.9%  blind 15.2%   11 measured, 7 kept here
#
# What went wrong in v1 is worth keeping: the questions tied themselves to the
# figure by DESCRIBING its structure in words, and the description gave away the
# answer. The rule that replaced it: the prompt sets up a state and never names
# the drawing choice that decides the answer.
#
# Selecting these seven took one more correction. Judged on the two Qwen variants
# alone, q20k, q20l, q20x and q20y5 all looked unsolvable — 0/6 or below chance
# with the figure — and were nearly cut as broken. Run against Sonnet 5 and Opus 5
# they resolve cleanly, Opus answering three of them 3/3. A question no weak model
# solves is a ceiling, not a defect; the distinction is whether a stronger model
# solves it, not whether the wrong answers happen to agree. Nothing here should be
# cut on weak-model evidence alone.
#
# Four candidates were dropped and are recorded in benchmark/review/q20_plic.md:
# two that a blind Sonnet answers 3/3 (one of them printing its own answer in the
# prompt), one whose blind score exceeds its sighted score, and one whose gold set
# no model reproduces.
# ─────────────────────────────────────────────────────────────────────────────
