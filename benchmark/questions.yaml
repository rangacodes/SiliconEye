  topic: block_diagram
  source: url_https___www.winbond.com_resource-files_w25q256fv_revg1_120214_qpi_website_rev_g.pdf/fig_009.jpeg
  answer_type: multiple_choice
  question: |
    The image is the top-level block diagram of a serial flash memory chip. One arrow
    enters the Status Register block through its right-hand edge.
    Which block does that arrow come from?
  options:
