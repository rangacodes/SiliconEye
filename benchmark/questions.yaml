# ────────────────────────────────────────────────────────────────
# Set 19 — Lattice iCE40 LP/HX, programmable I/O register block.
# Source: url_http___www.latticesemi.com___media_LatticeSemi_Documents_DataSheets_
#         iCE_iCE40LPHXFamilyDataSheet.pdf, page 11, Figure 2-6 (pipeline fig_002).
#
# The drawing is a PIO Pair: two pixel-identical programmable-I/O cells inside one
# grey panel, so per-cell answers are well defined and figure-wide answers double.
# Structure verified independently by two design agents and two auditors, all in
# agreement, and no gold in this set was found wrong on audit:
#   5 flip-flops per cell   input path 2 - output path 2 - output enable 1
#   2 of those carry a clock-input inversion bubble, one per data path
#   5 multiplexers per cell 4-input input mux - three 2-input output muxes -
#                           4-input output-enable mux
#   CLOCK_ENABLE gates both OUTPUT_CLK and INPUT_CLK; both gated rails span both
#   cells, the output rail clocking 3 flip-flops per cell and the input rail 2
#   the output rail continues past the clock pins into a NOR whose output steers
#   a multiplexer select, and the input multiplexer is fed back from downstream of
#   the D_IN_0 buffer, which is the latch LATCH_INPUT_VALUE controls
#
# The image is a 600 dpi re-render, 2640x3248. THAT WAS NOT NECESSARY. A control
# run of q19a, q19b, q19e and q19h against the pipeline extraction (837x1020) gave
# 3/6, 3/6, 6/6 and 3/6 against 3/6, 3/6, 4/6 and 3/6 here: no gain, and one item
# was easier at the lower resolution. The likely reason is that the serving stack
# caps pixels well below 8.6 MP, so both images reach the model at similar
# effective size. An earlier version of this comment claimed the re-render was what
# made the clock-bubble items possible; the measurement refutes it, and the claim
# is recorded here as withdrawn rather than deleted.
#
# What did hold up: questions built on the canonical structures above - the mux as
# a latch, the clock into a DDR select, a 4-input enable mux - leaked 4/6 to 6/6
# blind. The lesson is narrower than "meaningful facts leak". Blind models know
# structures; they do not know this vendor's counts and choices. That filter has a
# cost worth stating: selecting on blind ~= 0 selects against everything a model
# already knows, which pushes a set toward implementation trivia. Two candidates
# that came out of that pressure - a count of drawn multiplexer symbols and a count
# of drawn inversion points - were cut on audit for measuring the draftsman's
# decomposition rather than the design.
#
# Twenty candidates were measured against both Qwen variants, blind and sighted,
# 3 repeats each; six survive. Every "Measured" line below is the shipped wording,
# re-run after the audit rewordings - the earlier notes reported pre-revision
# numbers and were wrong to. Rejections are in benchmark/review/q19_ice40_pio.md.
#
# Known weakness, recorded rather than fixed: (q19a - q19b) x 2 numerically equals
# q19c's gold. The route is unsound - q19b's 2 is one input-path and one output-path
# register, not the input-rail count - but it arrives at 6, so a solver can be right
# by accident. q19e was removed for making a sound version of that derivation
# available.
# ────────────────────────────────────────────────────────────────
