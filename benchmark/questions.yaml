    than one interrupt target. Look only at the region that feeds Target 0. Which of
    the listed statements about the way that region is drawn hold? More than one of
    them may hold.
  correct_answer: [A, B, C, D]
  options:
    - {key: A, text: "Both lines that accumulate across the sources start from hardwired constants, not from stored values"}
    - {key: B, text: "A single decision line per source steers both of the multiplexers drawn for that source"}
    - {key: C, text: "The identifier a source can place on its line is fixed by wiring, not by a register"}
    - {key: D, text: "The comparison against this target's threshold value appears once, after the last source's stage"}
    - {key: E, text: "Each decision line passes through a gate that combines it with this target's enable bit"}
    - {key: F, text: "The reference each comparison is made against is taken straight from the neighbouring source's column"}

