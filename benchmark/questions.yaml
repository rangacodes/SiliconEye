# SiliconEye — benchmark question set (100 items).
#
# Each question has:
#   id             — unique short id (used in output files)
#   author         — first name of the human who authored the question
#   category       — "visual" (answer is read off the image alone) or
#                    "reasoning" (image must be combined with hardware
#                    design knowledge). Ignored by the runner; used when
#                    analysing which capability a model is missing.
#   image          — basename under `image_dir` (see benchmark/figure_sources.yaml
#                    for where each image comes from and how it is regenerated)
#   topic          — coarse category (block_diagram | schematic | fsm | waveform)
#   source         — provenance: path of the figure in the released corpus
#                    (dataset/figures.ndjson `path` column, minus the leading
#                    "figures/")
#   answer_type    — "numerical" | "yes_no" | "multiple_choice" | "multiple_choice_multi"
#   question       — prompt shown to the model (image is attached separately)
#   correct_answer — int for numerical; "Y"/"N" for yes_no; option key ("A"/"B"/...)
#                    for multiple_choice; list of keys (e.g. [A, D]) for
#                    multiple_choice_multi
#   options        — for MCQ variants only, list of {key, text}
#
# The runner appends a single-line answer-format instruction to every prompt
# based on answer_type — do NOT include that instruction in the question body
# here. Additional reasoning above/below the final answer is allowed and is
# ignored by the grader.
#
# Each question's `image` field is a basename that is joined against
# `image_dir` (below) at runtime. Passing `--degraded AXIS/LEVEL` to the
# runner swaps `image_dir` to `degraded/AXIS/LEVEL` so the same yaml can
# drive both clean and degraded evaluations.

image_dir: images

questions:

