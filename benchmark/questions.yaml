- id: q20z5_target_region_structure
  author: Anil
  category: reasoning
  image: q20_source.jpeg
  topic: block_diagram
  source: url_https___people.eecs.berkeley.edu__krste_papers_riscv-privileged-v1.9.pdf/fig_024.jpeg
  answer_type: multiple_choice_multi
  question: |
