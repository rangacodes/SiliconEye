# ────────────────────────────────────────────────────────────────
# Set 11 — Winbond W25Q256FV serial flash, top-level block diagram.
# Source: url_https___www.winbond.com_resource-files_w25q256fv_revg1_120214_qpi_website_rev_g.pdf
#         fig_009.jpeg (page 10), 1286x1437, copied verbatim from the pipeline.
# repo: osresearch/spispy (381 stars, tier_a, trust 1.5 — fpga).
#       An open-source SPI flash emulator: the semantics in this figure are
#       directly implementable in, and checkable against, that repo's RTL.
#
# First datasheet-sourced set (everything before this came from papers).
# Four properties of the drawing carry the difficulty. The first two were the
# original basis of the set; both turned out to be solved 2/2 with the figure and
# now serve only as background, with the items rebuilt on the last two.
#   1. Ellipsis notation. Only six sector boxes and six block boxes are drawn,
#      but the numbering runs Sector 0..15 and Block 0..511, so counting drawn
#      boxes gives 6 and 6 — both wrong. Reading the total off the numbering is
#      a one-step read, so q11d now asks which block adjoins the TALLEST of the
#      three ellipses, which needs their heights compared instead.
#   2. Arrowhead asymmetry. Exactly the four pins carrying an (IOn) annotation
#      are drawn bidirectional; CLK and /CS are plain inputs. Counting them is
#      easy, so q11b now counts leftward-pointing heads across the whole figure.
#   3. Occlusion. The dotted grey lines from Block Segmentation pass BEHIND the
#      tall "Write Protect Logic and Row Decode" column: they stop at its left
#      edge with no head and resume on its right edge with a head into the array.
#      Only three solid heads actually touch that column.
#   4. A long polyline with a decoy. The arrow into the Status Register's right
#      edge starts at Column Decode, runs left, turns up and passes the SPI block
#      with ~32 px of clearance without touching it. Both the textbook prior and
#      the geometry invite "SPI Command & Control Logic"; the drawing says
#      otherwise. This is what q11a tests.
# ────────────────────────────────────────────────────────────────
